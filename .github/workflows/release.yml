name: Release

# Nothing in this workflow publishes to npm. There is no NPM_TOKEN, no npm trusted publisher
# (OIDC) and no publish job, and none may be added.
#
#   - Push a tag v<version> from a commit on main whose package.json version matches the tag
#     (v0.2.0, or v0.2.0-rc.1 for a release candidate):
#       * verify: lint, type-check, tests, build, pack, package checks; the tarball is uploaded as
#         an artifact of the run.
#       * the release job creates a DRAFT GitHub release with the tarball attached (a draft
#         pre-release when the version contains "-").
#   - The maintainer reviews the draft. After LQA gives GO and Abdul says yes, the maintainer
#     publishes locally from a clean checkout of the tag with `npm publish --auth-type=web`
#     (npm web 2FA approval each time), then publishes the draft. See CONTRIBUTING.md ("Releasing").
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The pushed tag.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-branch ancestry check needs history

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: meta
        name: Tag matches package.json, commit is on main, CHANGELOG has the section
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RELEASE_TAG' is not a release tag (v<major>.<minor>.<patch>[-pre])"
            exit 1
          fi
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $V"
            exit 1
          fi
          # HEAD is the tagged commit (the checkout above uses the tag ref).
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          PRERELEASE=false
          case "$V" in *-*) PRERELEASE=true ;; esac
          # Accept "## 0.2.0" and "## [0.2.0] - 2026-01-12" (Keep a Changelog) headings.
          VRE=${V//./\\.}
          if [ "$PRERELEASE" = false ] && ! grep -Eq "^## (\[${VRE}\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?|${VRE})[[:space:]]*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

      # Before Pack: `attw --pack .` packs and then deletes playwright-logger-pro-<version>.tgz in
      # the repo root, which would remove the tarball the release attaches.
      - run: pnpm check:pkg

      - name: Pack (the tarball attached to the draft release)
        run: pnpm pack # playwright-logger-pro-<version>.tgz
      - name: Exactly one tarball for this version exists
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l playwright-logger-pro-*.tgz
          test "$(ls playwright-logger-pro-*.tgz | wc -l)" -eq 1
          test -f "playwright-logger-pro-${VERSION}.tgz"

      - name: Release notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            playwright-logger-pro-*.tgz
            release-notes.md
          if-no-files-found: error

  github-release:
    name: create draft GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # A draft is only visible to maintainers; the maintainer publishes it after the npm release.
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" playwright-logger-pro-*.tgz "${args[@]}"

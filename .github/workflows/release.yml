name: Release

# Push a tag v<version> from a commit on main whose package.json version matches the tag
# (v0.2.0, or v0.2.0-rc.1 for a release candidate):
#   - verify: tag/package.json/main/CHANGELOG checks, lint, type-check, tests, build, pack,
#     package checks; the tarball is uploaded as an artifact of the run.
#   - github-release: creates a DRAFT GitHub release with the tarball attached (a draft
#     pre-release when the version contains "-").
#   - publish: downloads the verified tarball, checks it is byte-identical to the asset on the
#     draft, publishes it to npm with npm trusted publishing (GitHub Actions OIDC, with provenance;
#     "next" dist-tag for pre-releases) and then publishes the GitHub release (Latest for stable
#     versions). If only the publish job fails, re-run that job: an npm version that is already
#     published is skipped.
# There is no NPM_TOKEN and no npm secret. `id-token: write` is granted to the publish job only.
# Anyone who can push a v* tag can publish; see CONTRIBUTING.md ("Releasing").
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The pushed tag.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-branch ancestry check needs history

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: meta
        name: Tag matches package.json, commit is on main, CHANGELOG has the section
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RELEASE_TAG' is not a release tag (v<major>.<minor>.<patch>[-pre])"
            exit 1
          fi
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $V"
            exit 1
          fi
          # HEAD is the tagged commit (the checkout above uses the tag ref).
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          PRERELEASE=false
          case "$V" in *-*) PRERELEASE=true ;; esac
          # Accept "## 0.2.0" and "## [0.2.0] - 2026-01-12" (Keep a Changelog) headings.
          VRE=${V//./\\.}
          if [ "$PRERELEASE" = false ] && ! grep -Eq "^## (\[${VRE}\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?|${VRE})[[:space:]]*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

      # Before Pack: `attw --pack .` packs and then deletes playwright-logger-pro-<version>.tgz in
      # the repo root, which would remove the tarball the release attaches.
      - run: pnpm check:pkg

      - name: Pack (the tarball attached to the draft release)
        run: pnpm pack # playwright-logger-pro-<version>.tgz
      - name: Exactly one tarball for this version exists
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l playwright-logger-pro-*.tgz
          test "$(ls playwright-logger-pro-*.tgz | wc -l)" -eq 1
          test -f "playwright-logger-pro-${VERSION}.tgz"

      - name: Release notes
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            playwright-logger-pro-*.tgz
            release-notes.md
          if-no-files-found: error

  github-release:
    name: create draft GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # A draft is only visible to maintainers; the publish job publishes it after the npm release.
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" playwright-logger-pro-*.tgz "${args[@]}"

  publish:
    name: publish to npm and publish the GitHub Release
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    # The only job with id-token: write (npm trusted publishing). contents: write is for
    # `gh release edit`. No environment, no secrets.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm and check its version
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          if ! printf '%s\n%s\n' 11.5.1 "$NPM_VERSION" | sort -V -C; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1 (required for trusted publishing)"
            exit 1
          fi

      # The exact tarball that `verify` built and checked.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: verified

      - name: The verified tarball is the asset attached to the draft release
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="verified/playwright-logger-pro-${VERSION}.tgz"
          test -f "$TARBALL"
          mkdir draft-asset
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'playwright-logger-pro-*.tgz' --dir draft-asset
          test "$(ls draft-asset | wc -l)" -eq 1
          test -f "draft-asset/playwright-logger-pro-${VERSION}.tgz"
          A=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          B=$(sha256sum "draft-asset/playwright-logger-pro-${VERSION}.tgz" | cut -d' ' -f1)
          echo "artifact:      $A"
          echo "draft release: $B"
          if [ "$A" != "$B" ]; then
            echo "::error::The tarball artifact differs from the asset attached to the draft release"
            exit 1
          fi
          # The package inside is the one this tag is for.
          NAME=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          PKG_VERSION=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::The tarball contains version $PKG_VERSION, expected $VERSION"
            exit 1
          fi
          echo "path=./$TARBALL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Already on npm?
        id: exists
        env:
          NAME: ${{ steps.tarball.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if FOUND=$(npm view "${NAME}@${VERSION}" version 2>npm-view.err); then
            if [ "$FOUND" = "$VERSION" ]; then
              echo "::notice::${NAME}@${VERSION} is already on npm; skipping npm publish and publishing the GitHub release"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 npm-view.err; then
            cat npm-view.err
            echo "::error::Could not look up ${NAME}@${VERSION} on npm"
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: npm publish (trusted publishing, provenance)
        if: steps.exists.outputs.published != 'true'
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          set -euo pipefail
          args=(--provenance --access public)
          if [ "$PRERELEASE" = true ]; then args+=(--tag next); fi
          npm publish "$TARBALL" "${args[@]}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --draft=false)
          # A pre-release stays a pre-release and is never marked Latest.
          if [ "$PRERELEASE" != true ]; then args+=(--latest); fi
          gh release edit "$RELEASE_TAG" "${args[@]}"
